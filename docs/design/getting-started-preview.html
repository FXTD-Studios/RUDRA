<style>

ter{font-size:11px;color:#a1a1a1;letter-spacing:1.5px;margin-bottom:12px}h1{font-size:30px;letter-spacing:-.8px;margin:0 0 12px;font-weight:600}.intro{color:#bcbcbc;line-height:1.7;max-width:530px;margin:0 0 26px;font-size:14px}.visual{height:122px;border:1px solid #3a3a3a;border-radius:9px;background:#232323;display:flex;align-items:center;padding:24px;gap:20px;margin-bottom:24px}.icon{width:62px;height:62px;background:#2d2d2d;border:1px solid #484848;border-radius:12px;display:grid;place-items:center;color:#d1d1d1;flex-shrink:0}.visual strong{font-size:14px;font-weight:600}.visual p{color:#a1a1a1;font-size:12px;line-height:1.7;margin:6px 0 0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px}.detail h2{font-size:12px;font-weight:600;margin:0 0 8px}.detail p{font-size:12px;color:#bcbcbc;line-height:1.8;margin:0}.tag{font-size:10px;color:#a1a1a1;font-weight:400;margin-left:7px}.footer{border-top:1px solid #343434;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:15px;background:#1c1c1c}.tip{font-size:11px;color:#a1a1a1}kbd{border:1px solid #484848;background:#2a2a2a;border-radius:4px;padding:3px 6px;font:10px 'Segoe UI',sans-serif;color:#d1d1d1}.actions{display:flex;gap:10px;align-items:center}.btn{background:#323232;border:1px solid #484848;color:#d1d1d1;border-radius:6px;padding:9px 17px;font-size:12px;font-weight:600}.btn:hover{background:#404040}.primary{background:#0a84ff;border-color:#0a84ff;color:white;min-width:112px}.primary:hover{background:#218fff}.btn:disabled{opacity:.35;cursor:default}.notice{height:22px;text-align:center;color:#a1a1a1;font-size:11px;margin:14px 0 0}@media(max-width:720px){body{padding:45px 12px 16px}.body{grid-template-columns:1fr}.sidebar{border-right:0;padding:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.eyebrow,.sidebar-note,.step small{display:none}.step{padding:8px 3px;justify-content:center;flex-direction:column;gap:6px}.step strong{font-size:10px}.content{padding:24px}.detail{gap:16px}.footer{padding:16px;flex-wrap:wrap}.tip{width:100%}.top{padding:0 20px}.brand span{font-size:11px;margin-left:10px;padding-left:10px}h1{font-size:26px}}
</style></head><body><div class="preview">DESIGN PREVIEW · NOT CONNECTED TO YOUR PROJECT</div><main><section class="dialog" role="region" aria-label="Getting started"><header class="top"><div class="brand">RUDRA<span>Getting started</span></div><button class="close" aria-label="Close preview" onclick="message('Preview only — your RUDRA session is unchanged.')">×</button></header><div class="body"><nav class="sidebar" aria-label="Getting started steps"><div class="eyebrow">YOUR FIRST HDR SHOT</div><div id="steps" style="display:contents"></div><div class="sidebar-note">Start with the built-in reconstruction.<br>The AI model is optional.</div></nav><section class="content" aria-live="polite"><div class="counter" id="counter"></div><h1 id="title"></h1><p class="intro" id="intro"></p><div class="visual"><div class="icon"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9h9l3 3h12v15H4z"/><path d="M4 9V6h9l3 3h9v3"/><path d="M16 17v7m-3-3 3 3 3-3"/></svg></div><div><strong id="cardTitle"></strong><p id="cardText"></p></div></div><div class="detail"><section><h2 id="leftTitle"></h2><p id="leftText"></p></section><section><h2 id="rightTitle"></h2><p id="rightText"></p></section></div></section></div><footer class="footer"><div class="tip">Your work, saved. <kbd>Ctrl</kbd> + <kbd>S</kbd> saves the project.</div><div class="actions"><button class="btn" onclick="message('In RUDRA, F1 opens the full user guide.')">User guide ↗</button><button class="btn" id="back" onclick="show(current-1)">Back</button><button class="btn primary" id="next" onclick="current<4?show(current+1):message('Preview complete — no project or application settings were changed.')">Next step →</button></div></footer></section><p class="notice" id="notice">Explore the five steps. This preview does not open files or change settings.</p></main>
<script>
const data=[
['Source','Open your footage','Start with your source','Bring in a still, a frame sequence or a movie. Choose the source curve so RUDRA can build the right HDR starting point.','Open a shot, or drop it into RUDRA','Stills · Numbered frame sequences · Movies','Choose the source curve','In Reconstruct → Source, start with BT.1886 for graded or broadcast SDR.','Working with CG or games?','Choose ACES, filmic or AgX when it matches the curve used to create your footage.'],
['Calibrate','Set a brightness reference','Give brightness a reference','Use known brightness values or a graded HDR reference to place your reconstruction on a meaningful scale. This step is optional.','Calibrate in the Reconstruct tab','Use up to three known-brightness patches, or an HDR reference.','Use known patches','Pick a black, grey or highlight patch and enter its brightness in nits.','Keep moving','No reference available? Continue with the starting reconstruction and assess the image in the viewer.'],
['Reconstruct','Shape the highlights','Shape your HDR image','Set the overall exposure, then refine clipped highlights. Keep the result grounded in the shot.','Start with exposure, then highlight fill','Exposure changes the master in stops.','Refine clipped areas','Use Fill clipped highlights. Set a region’s peak or reduce Strength where the result goes too far.','AI is optional','Reconstruct → Use the model adds learned reconstruction. You can work with the built-in reconstruction alone.'],
['Check','Compare with confidence','Check what changed','Compare the reconstruction with its baseline and inspect the bright areas before you deliver.','Compare, wipe and inspect','Hold B for the baseline. Use W to wipe.','Use the viewing tools','Adjust the view peak and inspect False colour and scopes. The view peak changes the display, not the master.','Review reconstructed detail','Invented shows where clipped areas were reconstructed. For movies, check several frames and use Clip → Hold steady.'],
['Deliver','Export your master','Deliver the right format','Choose a master for grading or an HDR movie for delivery. Save the project so you can return to the same settings.','Choose an output in the Deliver tab','EXR master · HDR10 · HLG · ProRes','For further grading','Export an ACES 2065-1 EXR master. Keep your project alongside the output.','For movie delivery','Choose the appropriate HDR format and review the export settings. Reopen this guide from Help → Getting started.']];
let current=0;const ids=['title','intro','cardTitle','cardText','leftTitle','leftText','rightTitle','rightText'];
function message(t){document.getElementById('notice').textContent=t}
function show(i){current=i;document.getElementById('steps').innerHTML=data.map((s,j)=>`<button class="step ${j===i?'active':''}" ${j===i?'aria-current="step"':''} onclick="show(${j})"><span class="num">${j+1}</span><span><strong>${s[0]}</strong><small>${s[1]}</small></span></button>`).join('');ids.forEach((id,j)=>document.getElementById(id).textContent=data[i][j+2]);document.getElementById('counter').textContent=`STEP 0${i+1} / 05`;document.getElementById('back').disabled=i===0;document.getElementById('next').textContent=i===4?'Start working →':'Next step →'}show(0);
</script></body></html>
