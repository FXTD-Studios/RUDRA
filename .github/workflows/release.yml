name: release

# The desktop beta: RUDRA.app in a DMG (macOS, Apple silicon), for
# Windows x64 an installer (setup.exe, Inno Setup) and a portable ZIP, and for
# Linux x86-64 a tar.gz built on glibc 2.28 (scripts/package_linux.sh, 1.2.6), each
# with its SHA-256, attached to a GitHub pre-release when
# a v* tag is pushed (git tag v0.9.0-beta.6 && git push origin v0.9.0-beta.6).
# The Windows package carries ffmpeg (PACKAGE_WINDOWS.ps1, pinned by hash).
# Run by hand (workflow_dispatch), it builds the two and keeps them as
# workflow artifacts without publishing. The packaging is the scripts'
# (scripts/package_mac.sh, scripts/PACKAGE_WINDOWS.ps1).
# Since 1.0.3 the packages carry NO model weights: the learned ACES 2.0 model and
# AI fill are downloaded inside the app, each with its licence. 1.0.0 to 1.0.2
# bundled sdr2hdr_image_v8 (Beta 2, non-commercial) by mistake; both packagers
# and tools/check_package_weights.py now refuse that, here and again on the
# uploaded files before anything is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Security review, 11 Nov 2026: every action is pinned to a commit (the tag it was taken from is in
# the comment beside it; a tag can be moved, a commit cannot), and the token is read-only unless a
# job says otherwise. Dependabot (.github/dependabot.yml) proposes the updates.
permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-15   # macos-14 images retire on 2 Nov 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          brew install ninja ffmpeg@6
          echo "$(brew --prefix ffmpeg@6)/bin" >> "$GITHUB_PATH"
      - name: Python (tests and the package check; no model is exported or bundled)
        run: |
          python -m pip install --upgrade pip
          pip install torch onnx onnxruntime numpy opencv-python-headless
          pip install -e .
      - name: Signing certificate and notary key (when the secrets are set)
        # docs/MACOS_SIGNING.md. Without MACOS_CERT_P12 the app is signed ad
        # hoc, as before, and the release still goes out.
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::No MACOS_CERT_P12 secret: the DMG is signed ad hoc and macOS warns on first open"
            exit 0
          fi
          kc="$RUNNER_TEMP/rudra-signing.keychain-db"
          kcpw=$(uuidgen)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          echo "MAC_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_KEY" ]; then
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "MAC_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
            echo "MAC_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID" >> "$GITHUB_ENV"
            echo "MAC_NOTARY_ISSUER=$MACOS_NOTARY_ISSUER" >> "$GITHUB_ENV"
          fi
      - name: Build and package
        run: PUBLIC_RELEASE=1 PYTHON=python tools/ci_run.sh "Package" scripts/package_mac.sh
      - name: No model weights in the DMG
        run: |
          dmg=$(ls dist/beta/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          rc=0; python tools/check_package_weights.py "$mnt/RUDRA.app" || rc=$?
          hdiutil detach "$mnt" >/dev/null
          exit $rc
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/rudra-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: rudra-macos
          path: |
            dist/beta/*.dmg
            dist/beta/*.dmg.sha256

  windows:
    name: Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read   # SignPath reads this run's job details and its signing-input-* artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with: { python-version: "3.12" }
      - name: Python (tests and the package check; no model is exported or bundled)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime numpy opencv-python-headless
          pip install -e .
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # 1.2.5: signed by SignPath (free code signing for open source; docs/CODE_SIGNING_POLICY.md).
      # Two signing requests, each approved by hand in SignPath: first RUDRA.exe and rudra-native.exe
      # in the package folder, so the ZIP and the installer carry them signed; then the installer.
      # Tag builds only, and only once the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID
      # variable are set; otherwise the packages are unsigned, as before. The artifact
      # configurations are .signpath/artifact-configurations/app.xml and installer.xml.
      - name: Signing (SignPath)
        id: signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not signed: SignPath signs v* tag builds once SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID are set"
          fi
      - name: Build and check the package folder
        shell: bash
        run: tools/ci_run.sh "Package" pwsh -NoProfile -File scripts/PACKAGE_WINDOWS.ps1 -Python python -Tests -PublicRelease -NoArchive
      - name: The package folder
        id: pkg
        shell: pwsh
        run: |
          $d = @(Get-ChildItem dist/beta -Directory | Where-Object { $_.Name -match '^RUDRA-(.+)-windows-x64$' })
          if ($d.Count -ne 1) { throw "expected one package folder in dist/beta, found $($d.Count)" }
          $v = $d[0].Name -replace '^RUDRA-(.+)-windows-x64$', '$1'
          # The tag's version (v1.2.5, or v1.2.5-rc.1 for a pre-release) is the one built.
          $core = $env:GITHUB_REF_NAME -replace '^v', '' -replace '-.*$', ''
          if ($env:GITHUB_REF_TYPE -eq "tag" -and ($v -replace '-.*$', '') -ne $core) { throw "tag $env:GITHUB_REF_NAME, package $v" }
          "dir=dist/beta/$($d[0].Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: The package folder, for signing
        id: unsigned-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: signing-input-app
          path: ${{ steps.pkg.outputs.dir }}
          retention-days: 1
      - name: Sign RUDRA.exe and rudra-native.exe (SignPath; approve the request there)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092   # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'RUDRA' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.pkg.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-app
      - name: The signed executables into the package folder
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $dir = "${{ steps.pkg.outputs.dir }}"
          foreach ($f in "RUDRA.exe", "rudra-native.exe") {
            Copy-Item (Join-Path "signed-app" $f) (Join-Path $dir $f) -Force
            $s = Get-AuthenticodeSignature (Join-Path $dir $f)
            if ($s.Status -ne "Valid") { throw "$f is not signed: $($s.Status) $($s.StatusMessage)" }
            Write-Host "$f signed by $($s.SignerCertificate.Subject)"
          }
      - name: ZIP and installer
        shell: bash
        run: tools/ci_run.sh "Archive" pwsh -NoProfile -File scripts/PACKAGE_WINDOWS_ARCHIVE.ps1 -Package "${{ steps.pkg.outputs.dir }}"
      - name: The installer, for signing
        id: unsigned-setup
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: signing-input-setup
          path: dist/beta/*-setup.exe
          retention-days: 1
      - name: Sign the installer (SignPath; approve the request there)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092   # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'RUDRA' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.pkg.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-setup
      - name: The signed installer and its checksum
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/beta -Filter "*-setup.exe" | Select-Object -First 1
          Copy-Item (Join-Path "signed-setup" $setup.Name) $setup.FullName -Force
          $s = Get-AuthenticodeSignature $setup.FullName
          if ($s.Status -ne "Valid") { throw "$($setup.Name) is not signed: $($s.Status) $($s.StatusMessage)" }
          Write-Host "$($setup.Name) signed by $($s.SignerCertificate.Subject)"
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($setup.Name)" | Set-Content -Encoding ascii "$($setup.FullName).sha256"
          Write-Host "$h  $($setup.Name)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: rudra-windows
          path: |
            dist/beta/*.zip
            dist/beta/*.zip.sha256
            dist/beta/*-setup.exe
            dist/beta/*-setup.exe.sha256

  linux:
    # 1.2.6 (readiness report, checklist item 10): built on the VFX Reference Platform CY2026 floor,
    # glibc 2.28 (AlmaLinux 8, RHEL 8's rebuild), so the tar.gz runs on Rocky / Alma / RHEL 8 and 9 and
    # every newer distribution. gcc-toolset-13 compiles C++20 and links the libstdc++ parts newer than
    # RHEL 8's in statically; scripts/package_linux.sh refuses anything needing more than glibc 2.28.
    name: Linux x86-64 (glibc 2.28)
    runs-on: ubuntu-24.04
    container: almalinux:8
    steps:
      - name: Build tools and Qt's X11 / GL / Wayland libraries
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf -y install gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils python3.12 python3.12-pip git tar gzip xz \
            findutils which file diffutils perl curl \
            mesa-libGL-devel mesa-libEGL-devel libxkbcommon-devel libxkbcommon-x11 fontconfig-devel freetype-devel \
            dbus-libs libX11-xcb xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-cursor \
            wayland-devel vulkan-headers gawk dejavu-sans-fonts
          python3.12 -m pip install cmake ninja patchelf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - name: Build, test and package
        run: |
          source /opt/rh/gcc-toolset-13/enable
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PUBLIC_RELEASE=1 PYTHON=python3.12 ORT_VERSION=1.24.4 CV_VERSION=4.14.0 \
            tools/ci_run.sh "Package" bash scripts/package_linux.sh
      - name: No model weights in the tar.gz
        run: python3.12 tools/check_package_weights.py dist/beta/*.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: rudra-linux
          path: |
            dist/beta/*.tar.gz
            dist/beta/*.tar.gz.sha256

  publish:
    # A tag with a suffix (v1.0.0-rc.1, v0.9.0-beta.10) is a pre-release; v1.0.0 is the release.
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # the one job that publishes the release
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7
        # rudra-macos and rudra-windows only: the signing-input-* artifacts are the unsigned files.
        with: { path: artifacts, pattern: "rudra-*", merge-multiple: true }
      - name: No model weights in what is published
        # The ZIP and the tar.gz are checked here; the installer holds the same folder as
        # the ZIP. The DMG was checked on the macOS runner.
        run: python3 tools/check_package_weights.py artifacts/*.zip artifacts/*.tar.gz
      - name: Release notes for this tag
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"
          f="docs/RELEASE_NOTES_${v}.md"
          [ -f "$f" ] || { echo "::error::no $f for tag $GITHUB_REF_NAME"; exit 1; }
          echo "path=$f" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3   # v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: RUDRA ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*
